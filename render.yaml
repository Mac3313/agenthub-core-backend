services:
  - type: web
    name: agenthub-core-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: starter
    region: frankfurt
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FERNET_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agenthub-production-db
          property: connectionString

  - type: worker
    name: agenthub-async-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.workers.webhook_processor"
    plan: starter
    region: frankfurt
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: agenthub-production-db
          property: connectionString
      - key: FERNET_SECRET_KEY
        fromService:
          type: web
          name: agenthub-core-api
          envVar: FERNET_SECRET_KEY

databases:
  - name: agenthub-production-db
    plan: starter
    region: frankfurt
 
  
